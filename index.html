<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e293b">
<title>Rabt Pro — Smart Queue</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #f8fafc;
    --panel: #ffffff;
    --border: #e2e8f0;
    --text: #1e293b;
    --text-soft: #64748b;
    --primary: #3b82f6;
    --primary-hover: #2563eb;
    --success: #10b981;
    --success-light: #d1fae5;
    --danger: #ef4444;
    --danger-light: #fee2e2;
    --warning: #f59e0b;
    --warning-light: #fef3c7;
    --muted: #f1f5f9;
    --radius: 16px;
    --nav-h: 72px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
  }
  
  [data-theme="dark"] {
    --bg: #0f172a;
    --panel: #1e293b;
    --border: #334155;
    --text: #f1f5f9;
    --text-soft: #94a3b8;
    --primary: #60a5fa;
    --primary-hover: #3b82f6;
    --success: #34d399;
    --success-light: #064e3b;
    --danger: #f87171;
    --danger-light: #7f1d1d;
    --warning: #fbbf24;
    --warning-light: #78350f;
    --muted: #1e293b;
    --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3), 0 2px 4px -2px rgb(0 0 0 / 0.2);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.3), 0 4px 6px -4px rgb(0 0 0 / 0.2);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    transition: background 0.3s, color 0.3s;
    overscroll-behavior-y: none;
  }

  .app {
    max-width: 600px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding-bottom: calc(var(--nav-h) + var(--safe-b));
  }

  /* Header */
  .header {
    background: var(--panel);
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
    backdrop-filter: blur(10px);
  }

  .header h1 {
    font-size: 20px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--primary), var(--success));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .header-actions {
    display: flex;
    gap: 8px;
  }

  .icon-btn {
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 12px;
    background: var(--muted);
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .icon-btn:hover {
    background: var(--border);
  }

  /* Stats */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    padding: 20px;
  }

  .stat-card {
    background: var(--panel);
    border-radius: var(--radius);
    padding: 16px;
    text-align: center;
    box-shadow: var(--shadow);
    transition: transform 0.2s;
  }

  .stat-card:hover {
    transform: translateY(-2px);
  }

  .stat-card .number {
    font-size: 28px;
    font-weight: 800;
    line-height: 1;
  }

  .stat-card .label {
    font-size: 11px;
    color: var(--text-soft);
    margin-top: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
  }

  .stat-card.pending .number { color: var(--warning); }
  .stat-card.valid .number { color: var(--success); }
  .stat-card.expired .number { color: var(--danger); }
  .stat-card.avoided .number { color: var(--text-soft); }

  /* Main Content */
  .main {
    flex: 1;
    padding: 0 20px;
  }

  .card {
    background: var(--panel);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }

  .card-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  /* Queue Section */
  .queue-card {
    text-align: center;
    padding: 30px 20px;
    min-height: 300px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .link-display {
    font-family: 'Roboto Mono', monospace;
    font-size: 14px;
    background: var(--muted);
    border-radius: 12px;
    padding: 16px;
    margin: 20px 0;
    word-break: break-all;
    border: 2px dashed var(--border);
  }

  .queue-actions {
    display: flex;
    gap: 12px;
    margin-top: 20px;
  }

  .btn {
    padding: 14px 20px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s;
    box-shadow: var(--shadow);
  }

  .btn:active {
    transform: scale(0.95);
  }

  .btn-open {
    background: var(--primary);
    color: white;
    font-size: 17px;
    padding: 16px;
  }

  .btn-open:hover {
    background: var(--primary-hover);
  }

  .btn-valid {
    background: var(--success);
    color: white;
  }

  .btn-valid:hover {
    background: #059669;
  }

  .btn-avoided {
    background: var(--danger);
    color: white;
  }

  .btn-avoided:hover {
    background: #dc2626;
  }

  .btn-ghost {
    background: var(--muted);
    color: var(--text);
  }

  .btn-ghost:hover {
    background: var(--border);
  }

  .btn-small {
    padding: 8px 12px;
    font-size: 13px;
    border-radius: 8px;
  }

  /* Swipe Actions */
  .swipe-container {
    position: relative;
    overflow: hidden;
    border-radius: var(--radius);
  }

  .swipe-bg {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    font-size: 24px;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .swipe-bg.left { background: var(--success); }
  .swipe-bg.right { background: var(--danger); }

  .swipe-content {
    background: var(--panel);
    position: relative;
    transition: transform 0.3s;
    z-index: 1;
  }

  /* Import Section */
  .import-section {
    display: none;
  }

  .import-section.active {
    display: block;
  }

  .import-options {
    margin-top: 16px;
  }

  .date-filter {
    margin: 16px 0;
  }

  .date-filter label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .date-filter select {
    width: 100%;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    background: var(--panel);
    color: var(--text);
  }

  .whatsapp-selector {
    margin: 16px 0;
  }

  .whatsapp-selector label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .whatsapp-options {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }

  .wa-option {
    padding: 12px;
    border: 2px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.2s;
  }

  .wa-option:hover {
    border-color: var(--primary);
  }

  .wa-option.selected {
    border-color: var(--primary);
    background: var(--primary);
    color: white;
  }

  /* Library Section */
  .library-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .link-item {
    background: var(--panel);
    border-radius: 12px;
    padding: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow);
  }

  .link-item .status-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }

  .link-item .status-icon.valid { background: var(--success-light); color: var(--success); }
  .link-item .status-icon.expired { background: var(--danger-light); color: var(--danger); }
  .link-item .status-icon.avoided { background: var(--muted); color: var(--text-soft); }
  .link-item .status-icon.pending { background: var(--warning-light); color: var(--warning); }

  .link-item .link-info {
    flex: 1;
    min-width: 0;
  }

  .link-item .link-url {
    font-size: 13px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .link-item .link-meta {
    font-size: 11px;
    color: var(--text-soft);
    margin-top: 4px;
  }

  .link-item .item-actions {
    display: flex;
    gap: 4px;
  }

  .action-btn {
    width: 32px;
    height: 32px;
    border: none;
    border-radius: 8px;
    background: var(--muted);
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s;
  }

  .action-btn:hover {
    background: var(--border);
  }

  .action-btn.delete:hover {
    background: var(--danger);
    color: white;
  }

  /* Settings Section */
  .settings-group {
    margin-bottom: 24px;
  }

  .settings-group h3 {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 12px;
    color: var(--text-soft);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .settings-item {
    margin-bottom: 12px;
  }

  .settings-item label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .settings-item .hint {
    font-size: 12px;
    color: var(--text-soft);
    margin-bottom: 8px;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: calc(var(--nav-h) + var(--safe-b) + 16px);
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: var(--bg);
    padding: 14px 24px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    z-index: 100;
    box-shadow: var(--shadow-lg);
    max-width: 90%;
    text-align: center;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Bottom Navigation */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--panel);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-around;
    padding: 8px 0;
    padding-bottom: var(--safe-b);
    z-index: 50;
    max-width: 600px;
    margin: 0 auto;
    box-shadow: 0 -4px 6px -1px rgb(0 0 0 / 0.1);
  }

  .nav-btn {
    flex: 1;
    border: none;
    background: none;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    color: var(--text-soft);
    font-size: 12px;
    font-weight: 600;
    padding: 8px;
    transition: all 0.2s;
  }

  .nav-btn.active {
    color: var(--primary);
  }

  .nav-btn .icon {
    font-size: 20px;
  }

  .nav-btn .badge {
    position: absolute;
    top: 4px;
    right: 4px;
    background: var(--danger);
    color: white;
    font-size: 9px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 10px;
    min-width: 16px;
  }

  /* Modal */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgb(0 0 0 / 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s;
  }

  .modal-overlay.show {
    opacity: 1;
    visibility: visible;
  }

  .modal {
    background: var(--panel);
    border-radius: var(--radius);
    padding: 24px;
    max-width: 400px;
    width: 90%;
    box-shadow: var(--shadow-lg);
    transform: scale(0.9);
    transition: transform 0.3s;
  }

  .modal-overlay.show .modal {
    transform: scale(1);
  }

  .modal h3 {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 16px;
  }

  .modal-actions {
    display: flex;
    gap: 12px;
    margin-top: 20px;
  }

  /* RTL Support */
  [dir="rtl"] .bottom-nav .badge {
    right: auto;
    left: 4px;
  }
</style>
</head>
<body>
<div class="app">
  
  <header class="header">
    <h1>Rabt Pro</h1>
    <div class="header-actions">
      <button class="icon-btn" id="themeToggle" title="Toggle theme">🌙</button>
      <button class="icon-btn" id="langToggle" title="Language">🌐</button>
    </div>
  </header>

  <div class="stats">
    <div class="stat-card pending">
      <div class="number" id="pendingCount">0</div>
      <div class="label">Pending</div>
    </div>
    <div class="stat-card valid">
      <div class="number" id="validCount">0</div>
      <div class="label">Valid</div>
    </div>
    <div class="stat-card expired">
      <div class="number" id="expiredCount">0</div>
      <div class="label">Expired</div>
    </div>
    <div class="stat-card avoided">
      <div class="number" id="avoidedCount">0</div>
      <div class="label">Avoided</div>
    </div>
  </div>

  <main class="main">
    <!-- Queue Section -->
    <section class="section active" id="queueSection">
      <div class="card queue-card">
        <div class="swipe-container" id="swipeContainer">
          <div class="swipe-bg left">✅</div>
          <div class="swipe-bg right">❌</div>
          <div class="swipe-content" id="swipeContent">
            <div class="eyebrow" id="queuePosition">No links</div>
            <div class="link-display" id="currentLink">Add links to begin</div>
            <div class="link-meta" id="linkMeta">—</div>
          </div>
        </div>
        
        <div class="queue-actions">
          <button class="btn btn-open" id="openLinkBtn">
            <span>📱</span> Open in WhatsApp
          </button>
        </div>
        
        <div class="queue-actions" id="decisionActions" style="display: none;">
          <button class="btn btn-valid" id="validBtn">
            <span>✅</span> Valid
          </button>
          <button class="btn btn-avoided" id="avoidedBtn">
            <span>❌</span> Avoided
          </button>
        </div>

        <div class="queue-actions">
          <button class="btn btn-ghost btn-small" id="undoBtn" style="display: none;">
            ↺ Undo
          </button>
        </div>
      </div>

      <!-- Quick Actions -->
      <div class="card">
        <div class="card-title">
          <span>Quick Actions</span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;">
          <button class="btn btn-ghost btn-small" id="startSessionBtn">▶ Start Session</button>
          <button class="btn btn-ghost btn-small" id="exportValidBtn">📤 Export Valid</button>
          <button class="btn btn-ghost btn-small" id="deleteExpiredBtn">🗑 Delete Expired</button>
          <button class="btn btn-ghost btn-small" id="deleteAvoidedBtn">🗑 Delete Avoided</button>
        </div>
      </div>
    </section>

    <!-- Import Section -->
    <section class="section" id="importSection">
      <div class="card">
        <div class="card-title">
          <span>Import Links</span>
          <span class="status-badge" id="importStatus">—</span>
        </div>
        
        <div class="import-options">
          <div class="date-filter">
            <label>Import from:</label>
            <select id="dateFilter">
              <option value="7">Last 7 days</option>
              <option value="30" selected>Last 30 days</option>
              <option value="90">Last 90 days</option>
              <option value="365">Last year</option>
              <option value="all">All time</option>
            </select>
          </div>

          <div class="whatsapp-selector">
            <label>Open links in:</label>
            <div class="whatsapp-options" id="whatsappOptions">
              <div class="wa-option" data-wa="whatsapp">💬 WhatsApp</div>
              <div class="wa-option" data-wa="business">💼 Business</div>
              <div class="wa-option" data-wa="dual">📱 Dual</div>
              <div class="wa-option" data-wa="ask">❓ Ask me</div>
            </div>
          </div>

          <div class="file-drop" id="fileDrop">
            <input type="file" id="fileInput" accept=".txt,.pdf,.docx">
            <div class="file-icon">📁</div>
            <div class="file-text">Drop file here or tap to browse</div>
          </div>

          <button class="btn btn-primary btn-full" id="importBtn" disabled>
            🔄 Import & Process
          </button>
        </div>
      </div>
    </section>

    <!-- Library Section -->
    <section class="section" id="librarySection">
      <div class="card">
        <div class="card-title">
          <span>Library</span>
          <div style="display: flex; gap: 8px;">
            <input type="text" id="searchBox" placeholder="Search..." style="padding: 8px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px;">
          </div>
        </div>
        
        <div class="filter-tabs" style="display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap;">
          <button class="filter-btn" data-filter="all" style="padding: 6px 12px; border: 1px solid var(--border); border-radius: 20px; font-size: 12px; cursor: pointer; background: var(--panel); color: var(--text);">All</button>
          <button class="filter-btn" data-filter="pending" style="padding: 6px 12px; border: 1px solid var(--border); border-radius: 20px; font-size: 12px; cursor: pointer; background: var(--panel); color: var(--text);">Pending</button>
          <button class="filter-btn" data-filter="valid" style="padding: 6px 12px; border: 1px solid var(--border); border-radius: 20px; font-size: 12px; cursor: pointer; background: var(--panel); color: var(--text);">Valid</button>
          <button class="filter-btn" data-filter="expired" style="padding: 6px 12px; border: 1px solid var(--border); border-radius: 20px; font-size: 12px; cursor: pointer; background: var(--panel); color: var(--text);">Expired</button>
          <button class="filter-btn" data-filter="avoided" style="padding: 6px 12px; border: 1px solid var(--border); border-radius: 20px; font-size: 12px; cursor: pointer; background: var(--panel); color: var(--text);">Avoided</button>
        </div>

        <div class="library-list" id="libraryList"></div>
      </div>
    </section>

    <!-- Settings Section -->
    <section class="section" id="settingsSection">
      <div class="card">
        <div class="settings-group">
          <h3>General</h3>
          <div class="settings-item">
            <label>Language</label>
            <div class="settings-options">
              <button class="btn btn-ghost btn-small" id="setEnglish">English</button>
              <button class="btn btn-ghost btn-small" id="setArabic">العربية</button>
            </div>
          </div>
        </div>

        <div class="settings-group">
          <h3>WhatsApp</h3>
          <div class="settings-item">
            <label>Default WhatsApp</label>
            <div class="hint">Choose which WhatsApp app opens links</div>
            <select id="defaultWhatsApp" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px;">
              <option value="whatsapp">WhatsApp</option>
              <option value="business">WhatsApp Business</option>
              <option value="dual">WhatsApp Dual</option>
              <option value="ask">Ask every time</option>
            </select>
          </div>
        </div>

        <div class="settings-group">
          <h3>Data Management</h3>
          <div class="settings-item">
            <button class="btn btn-danger" id="clearAllBtn" style="background: var(--danger); color: white; padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">
              🗑 Clear All Data
            </button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-nav="queue">
      <span class="icon">▶</span>
      <span>Queue</span>
      <span class="badge" id="queueBadge" style="display: none;">0</span>
    </button>
    <button class="nav-btn" data-nav="import">
      <span class="icon">📥</span>
      <span>Import</span>
    </button>
    <button class="nav-btn" data-nav="library">
      <span class="icon">📚</span>
      <span>Library</span>
    </button>
    <button class="nav-btn" data-nav="settings">
      <span class="icon">⚙️</span>
      <span>Settings</span>
    </button>
  </nav>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="whatsAppModal">
  <div class="modal">
    <h3>Choose WhatsApp</h3>
    <div class="modal-actions" style="flex-direction: column;">
      <button class="btn btn-primary" onclick="openInSelected('whatsapp')">💬 WhatsApp</button>
      <button class="btn btn-primary" onclick="openInSelected('business')">💼 WhatsApp Business</button>
      <button class="btn btn-primary" onclick="openInSelected('dual')">📱 WhatsApp Dual</button>
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    </div>
  </div>
